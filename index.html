<title>Uniglory Wheels – Price List</title>

<style>
:root{
  --bg:#eceff2; --surface:#ffffff; --ink:#15212b; --muted:#5d6b78; --line:#dbe1e6;
  --accent:#17508f; --accent-ink:#ffffff; --chip:#ffffff; --tag:#e6ecf1; --mark:#ffe58a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#10161c; --surface:#18212a; --ink:#e8eef3; --muted:#93a1ae; --line:#27333e;
  --accent:#6cb0ff; --accent-ink:#0b1722; --chip:#18212a; --tag:#243240; --mark:#6b5a10;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 2px 8px}
.brand h1{font-size:17px;margin:0;font-weight:750;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:12px;padding:12px 40px 12px 42px;outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;
  stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search button{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;
  background:none;color:var(--muted);font-size:22px;display:none;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;margin:0 -12px;padding-left:14px;padding-right:14px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:var(--chip);
  border:1.5px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.chip small{font-weight:500;color:var(--muted);margin-left:4px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed=true] small{color:inherit;opacity:.8}
.sub{display:none;gap:8px;margin-top:8px}
.sub.on{display:flex}
.sub select{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:9px 8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--muted)}
.bar select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);
  border-radius:8px;padding:5px 6px}
main{padding:4px 12px 28px;max-width:760px;margin:0 auto}
.grp{font-size:13px;font-weight:700;color:var(--muted);margin:16px 4px 6px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.l{min-width:0}
.nm{font-weight:650;font-size:15.5px;overflow-wrap:anywhere}
.cd{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{font-size:12px;background:var(--tag);border-radius:6px;padding:2px 7px;color:var(--ink)}
.r{text-align:right;flex:0 0 auto}
.pr{font-size:19px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--accent)}
.un{font-size:12px;color:var(--muted);margin-top:1px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--muted);padding:44px 16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 24px}
:root[data-theme="dark"]{--bg:#10161c; --surface:#18212a; --ink:#e8eef3; --muted:#93a1ae; --line:#27333e;--accent:#6cb0ff; --accent-ink:#0b1722; --chip:#18212a; --tag:#243240; --mark:#6b5a10;}
</style>

const ITEMS = DATA.items, ORDER = DATA.order;
const $ = id => document.getElementById(id);
const norm = s => String(s).toLowerCase().replace(/["”“″']/g,'').replace(/\s+/g,' ').trim();
ITEMS.forEach(i => { i.h = norm([i.c,i.n,i.k,i.size,i.prof,i.wall,i.fin,i.ty,i.u].filter(Boolean).join(' ')); });
const WALL = {'D/W':'Double wall','S/W':'Single wall','F/S':'Freestyle','Fat Bike':'Fat bike'};
let cat = 'All';

function money(p){ return '$' + (p < 0.1 ? p.toFixed(3) : p.toFixed(2)); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hi(text, terms){
  const ts = terms.filter(Boolean).map(x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!ts.length) return esc(text);
  const re = new RegExp('(' + ts.join('|') + ')','ig');
  return String(text).split(re).map((p,i) => i%2 ? '<mark>'+esc(p)+'</mark>' : esc(p)).join('');
}

function buildChips(){
  const counts = {All: ITEMS.length};
  ITEMS.forEach(i => counts[i.c] = (counts[i.c]||0)+1);
  $('chips').innerHTML = ['All',...ORDER].map(c =>
    `<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${c}<small>${counts[c]}</small></button>`).join('');
}
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if(!b) return;
  cat = b.dataset.c; buildChips(); setupSub(); render();
  b.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
});

function opts(sel, label, vals){
  const cur = sel.value;
  sel.innerHTML = `<option value="">${label}</option>` + vals.map(v => `<option>${esc(v)}</option>`).join('');
  if (vals.includes(cur)) sel.value = cur;
}
function setupSub(){
  const on = cat === 'Rim';
  $('sub').classList.toggle('on', on);
  if(!on){ ['fSize','fWall','fFin'].forEach(id => $(id).value=''); return; }
  const rims = ITEMS.filter(i => i.c==='Rim');
  const uniq = k => [...new Set(rims.map(i=>i[k]))];
  const sizeOrder = ['12"','14"','16"','18"','20"','24"','26"','650B/27.5"','700C/29"'];
  opts($('fSize'),'All sizes', uniq('size').sort((a,b)=>sizeOrder.indexOf(a)-sizeOrder.indexOf(b)));
  opts($('fWall'),'All types', uniq('wall'));
  opts($('fFin'),'All finishes', uniq('fin'));
  [...$('fWall').options].forEach(o => { if(WALL[o.value]) o.textContent = WALL[o.value]; });
}

function render(){
  const raw = $('q').value;
  const terms = norm(raw).split(' ').filter(Boolean);
  $('x').style.display = raw ? 'block' : 'none';
  let rows = ITEMS.filter(i => (cat==='All' || i.c===cat) && terms.every(t => i.h.includes(t)));
  if (cat==='Rim'){
    const s=$('fSize').value, w=$('fWall').value, f=$('fFin').value;
    rows = rows.filter(i => (!s||i.size===s) && (!w||i.wall===w) && (!f||i.fin===f));
  }
  const sort = $('sort').value;
  if (sort==='asc') rows.sort((a,b)=>a.p-b.p);
  else if (sort==='desc') rows.sort((a,b)=>b.p-a.p);
  else if (sort==='name') rows.sort((a,b)=>a.n.localeCompare(b.n,undefined,{numeric:true}));
  $('count').textContent = rows.length + (rows.length===1?' product':' products');

  if(!rows.length){
    $('list').innerHTML = '<div class="empty"><b>No products found</b>Try fewer words, or choose All.</div>'; return;
  }
  const groups = [];
  if (cat==='All' && sort==='def'){
    ORDER.forEach(c => { const g = rows.filter(i=>i.c===c); if(g.length) groups.push([c,g]); });
  } else groups.push([null, rows]);

  $('list').innerHTML = groups.map(([title,g]) =>
    (title?`<div class="grp">${title}</div>`:'<div style="height:10px"></div>') +
    '<ul>' + g.map(i => {
      const tags = [];
      if (i.c==='Rim'){ tags.push(i.size, WALL[i.wall]||i.wall, i.fin, 'Profile '+i.prof); }
      if (i.ty) tags.push(i.ty);
      if (cat==='All' && sort!=='def' || (cat==='All' && !title)) tags.unshift(i.c);
      return `<li><div class="l"><div class="nm">${hi(i.n,terms)}</div>` +
        (i.k?`<div class="cd">${hi(i.k,terms)}</div>`:'') +
        (tags.length?`<div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:'') +
        `</div><div class="r"><div class="pr">${money(i.p)}</div><div class="un">per ${esc(i.u.toLowerCase())}</div></div></li>`;
    }).join('') + '</ul>'
  ).join('');
}

let t; $('q').addEventListener('input', () => { clearTimeout(t); t = setTimeout(render, 80); });
$('x').addEventListener('click', () => { $('q').value=''; render(); $('q').focus(); });
['sort','fSize','fWall','fFin'].forEach(id => $(id).addEventListener('change', render));
buildChips(); setupSub(); render();
</script>
</body>
</html>
